name: Amap API smoke tests

on:
  workflow_dispatch:
  release:
    types: [prereleased, published]

permissions:
  contents: read

jobs:
  live-api-smoke:
    name: Live Web API smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          python-version: "3.10"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest --no-cov -q tests/live_api_smoke.py
        env:
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
