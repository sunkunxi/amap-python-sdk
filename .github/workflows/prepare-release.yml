name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      target_branch:
        description: Branch to prepare the release for
        required: true
        default: main
        type: string

permissions: {}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      BUMP: ${{ inputs.bump }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.target_branch }}
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: ".python-version"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Bump version and update lock
        id: version
        run: |
          set -euo pipefail
          git check-ref-format --branch "$TARGET_BRANCH"
          uv version --bump "$BUMP"
          uv lock
          uv lock --check
          version="$(uv version --short)"
          if git show-ref --tags --verify --quiet "refs/tags/${version}"; then
            echo "Release tag ${version} already exists; update the project version before preparing another release." >&2
            exit 1
          fi
          branch="release/${version}-${GITHUB_RUN_ID}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
      - name: Validate release
        run: |
          uv sync --locked --group test --group lint
          uv run --no-sync pytest
          uv run --no-sync ruff check amap tests
          uv run --no-sync black --check amap tests
          uv run --no-sync mypy
      - name: Create release pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          set -euo pipefail
          git switch -c "$RELEASE_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          if git diff --staged --quiet; then
            echo "No release version changes to commit" >&2
            exit 1
          fi
          git commit -m "chore: prepare release ${VERSION}"
          gh auth setup-git
          git push --set-upstream origin "$RELEASE_BRANCH"
          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$RELEASE_BRANCH" \
            --title "Release ${VERSION}" \
            --body "Prepare release ${VERSION} for branch \`${TARGET_BRANCH}\`. Merging this PR will create a draft GitHub Release with generated release notes."
