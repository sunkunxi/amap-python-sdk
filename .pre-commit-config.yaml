# Adapted from FastAPI's pre-commit configuration for this uv-based project.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=750"]
        exclude: ^uv\.lock$
      - id: check-toml
      - id: check-yaml
        args: ["--unsafe"]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/crate-ci/typos
    rev: 00f422f3b19c57bc6338715ebfe3316d38768461
    hooks:
      - id: typos
        args: [--force-exclude]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude --fix --exit-non-zero-on-fix
        language: unsupported
        types: [python]
        require_serial: true

      - id: black
        name: black
        entry: uv run black
        language: unsupported
        types: [python]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy amap
        language: unsupported
        pass_filenames: false
        require_serial: true
